<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>職缺過濾器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; --fg:#1f2328; --muted:#656d76; --bg:#ffffff; --line:#d0d7de; --accent:#2563eb; --accent-fg:#fff; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e6edf3; --muted:#9da7b3; --bg:#1b1f24; --line:#3d444d; --accent:#4f8cff; --accent-fg:#0b1220; } }
    body { margin:0; width:280px; padding:14px; font:14px/1.5 system-ui,"Microsoft JhengHei","PingFang TC",sans-serif; color:var(--fg); background:var(--bg); }
    h1 { margin:0 0 10px; font-size:15px; }
    .count { font-size:28px; font-weight:700; line-height:1.2; }
    .note { margin:2px 0 12px; color:var(--muted); font-size:12px; }
    button { display:block; width:100%; margin-top:8px; padding:8px 10px; font:inherit; color:var(--fg); background:transparent; border:1px solid var(--line); border-radius:8px; cursor:pointer; }
    button:hover:not(:disabled) { border-color:var(--accent); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    button.primary { color:var(--accent-fg); background:var(--accent); border-color:var(--accent); }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  </style>
</head>
<body>
  <h1>職缺過濾器（適用 104）</h1>
  <div class="count" id="count">—</div>
  <p class="note" id="note">讀取中…</p>
  <button type="button" class="primary" id="toggle" disabled>暫時顯示全部</button>
  <button type="button" id="options">開啟設定</button>
  <script src="popup.js"></script>
</body>
</html>
